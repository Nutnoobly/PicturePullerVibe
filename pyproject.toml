[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "picture-puller"
version = "0.1.0"
description = "CLI application to pull layered carousel series pictures (background, character, logo) using script injection"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12.0",
    "rich>=13.0.0",
    "playwright>=1.40.0",
    "httpx>=0.27.0",
    "pydantic>=2.5.0",
]

[project.scripts]
picture-puller = "picture_puller.cli:app"

[tool.setuptools.packages.find]
where = ["src"]
